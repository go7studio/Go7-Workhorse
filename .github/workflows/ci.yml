name: CI

# Release only builds when a version is cut, so a branch could sit broken for
# days. This runs the same checks on every push and pull request, and is what
# branch protection on main should require.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate eval contracts
        run: npm run eval:validate

      # The learning store needs FTS5. Prove the runtime has it before the
      # tests assume it.
      - name: SQLite FTS5 probe
        run: npm run probe:sqlite

      - name: Test
        run: npm test

  # A build can exit 0 and ship an app that cannot read its own files. Pack it
  # and exercise the learning store inside the packaged tree.
  packaged-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: pack:win
            platform: win
          - os: macos-latest
            pack: pack:mac
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack ${{ matrix.platform }}
        run: npm run ${{ matrix.pack }}

      - name: Packaged learning smoke
        run: node scripts/learning-packaged-smoke.mjs --platform ${{ matrix.platform }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisory for now: a new advisory should not block a merge on its own.
      - name: Dependency audit
        run: npm audit --audit-level=high || true

      # This one does block. A key or token reaching the repo is not a warning.
      - name: Secret scan
        run: |
          set -euo pipefail
          patterns='sk-ant-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}'
          if git grep -nIE "$patterns" -- . ':!package-lock.json' ':!*.test.ts'; then
            echo "::error::A credential-shaped string is committed. Remove it and rotate the key."
            exit 1
          fi
          echo "No credential-shaped strings found."
