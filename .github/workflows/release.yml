name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      # One at a time: the first machine creates the release, the second
      # uploads into it. Running together races on `gh release create`.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
            installer: '*Workhorse-Setup-*.exe'
          - os: macos-latest
            script: package:mac
            installer: '*Workhorse-*-mac.dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Test
        run: npm test

      - name: Packaged learning smoke
        run: node scripts/learning-packaged-smoke.mjs

      - name: Build installer
        env:
          WORKHORSE_RELEASE_BUILD: ${{ runner.os == 'macOS' && '1' || '0' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CSC_NAME: ${{ runner.os == 'macOS' && secrets.MAC_CSC_NAME || '' }}
        run: npm run ${{ matrix.script }}

      - id: ver
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release and installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $installer = Get-ChildItem -Path "release" -File -Filter "${{ matrix.installer }}" | Select-Object -First 1
          if (-not $installer) { throw "No installer matched ${{ matrix.installer }}" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName --clobber
          } else {
            gh release create $tag $installer.FullName --target "${{ github.sha }}" --title "Go7 Workhorse ${{ steps.ver.outputs.version }}" --generate-notes
          }
