name: Release

# Pushing to main publishes nothing. release-please keeps one pull request up
# to date with the next version and its changelog; merging that pull request is
# what cuts a release. Nothing here can block a push or a merge.
#
# Run this by hand when you want installers to test. They attach to the run, so
# testing never spends a version number.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reads the commits since the last tag, works out the next version, and keeps
  # the release pull request in step with it. On merge it tags and creates the
  # release. Nothing else in this file decides a version.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      cut: ${{ steps.please.outputs.releases_created }}
      tag: ${{ steps.please.outputs.tag_name }}
      version: ${{ steps.please.outputs.version }}
    steps:
      # `node` reads and writes package.json, so the version the desk compares
      # itself against is the same one that gets tagged.
      - uses: googleapis/release-please-action@v5
        id: please
        with:
          release-type: node

  installers:
    needs: version
    if: ${{ !cancelled() && needs.version.result != 'failure' && (needs.version.outputs.cut == 'true' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
            installer: "*Workhorse-Setup-*.exe"
          - os: macos-latest
            script: package:mac
            installer: "*Workhorse-*-mac.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Test
        run: npm test

      - name: Build installer
        env:
          # Only a release has to be signed and notarized. Demanding a
          # certificate for a test build would mean never getting one.
          WORKHORSE_RELEASE_BUILD: ${{ (runner.os == 'macOS' && needs.version.outputs.cut == 'true') && '1' || '0' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CSC_NAME: ${{ runner.os == 'macOS' && secrets.MAC_CSC_NAME || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.MAC_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.MAC_APPLE_TEAM_ID || '' }}
        run: npm run ${{ matrix.script }}

      - name: Packaged learning smoke
        run: node scripts/learning-packaged-smoke.mjs

      # Held here rather than sent straight to the release, so a machine that
      # fails cannot leave half a release behind.
      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: release/${{ matrix.installer }}
          if-no-files-found: error

  # Both installers or neither. 0.1.6 published a dmg with no exe and 0.1.8 an
  # exe with no dmg. Each was marked latest, and each was broken for half the
  # people who downloaded it.
  publish:
    needs: [version, installers]
    if: ${{ needs.version.outputs.cut == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Attach the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" installers/* --clobber --repo "${{ github.repository }}"
