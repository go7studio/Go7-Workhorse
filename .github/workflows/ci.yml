name: CI

# Release only builds when a version is cut, so a branch could sit broken for
# days. This runs the same checks on every push and pull request, and is what
# branch protection on main should require.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate eval contracts
        run: npm run eval:validate

      # The learning store needs FTS5. Prove the runtime has it before the
      # tests assume it.
      - name: SQLite FTS5 probe
        run: npm run probe:sqlite

      - name: Test
        run: npm test

  # A build can exit 0 and ship an app that cannot read its own files. Pack it
  # and exercise the learning store inside the packaged tree.
  packaged-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: pack:win
            platform: win
          - os: macos-latest
            pack: pack:mac
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack ${{ matrix.platform }}
        run: npm run ${{ matrix.pack }}

      - name: Packaged learning smoke
        run: node scripts/learning-packaged-smoke.mjs --platform ${{ matrix.platform }}

  # release-please builds the changelog from commit subjects. A pull request
  # where no subject carries a type merges cleanly and then never reaches a
  # changelog, so the work ships unlisted and nobody finds out until someone
  # reads a release and notices it is missing. Catch it while it is still one
  # reword away.
  commit-types:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: At least one commit carries a type
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          subjects="$(git log --no-merges --format=%s "$BASE..$HEAD")"
          if [ -z "$subjects" ]; then
            echo "No commits to check."
            exit 0
          fi
          echo "$subjects"
          if grep -qE "^($types)(\([^)]+\))?!?: " <<< "$subjects"; then
            echo "OK."
            exit 0
          fi
          echo "::error::No commit here starts with a type, so release-please cannot see this work and it will ship unlisted. Reword one subject to start with 'fix: ' or 'feat: ' — see CONTRIBUTING.md."
          exit 1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisory for now: a new advisory should not block a merge on its own.
      - name: Dependency audit
        run: npm audit --audit-level=high || true

      # This one does block. A key or token reaching the repo is not a warning.
      - name: Secret scan
        run: |
          set -euo pipefail
          patterns='sk-ant-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}'
          if git grep -nIE "$patterns" -- . ':!package-lock.json' ':!*.test.ts'; then
            echo "::error::A credential-shaped string is committed. Remove it and rotate the key."
            exit 1
          fi
          echo "No credential-shaped strings found."
