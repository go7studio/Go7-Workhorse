name: Release

# Pushing to main publishes nothing. release-please keeps one pull request up
# to date with the next version and its changelog; merging that pull request is
# what cuts a release. Nothing here can block a push or a merge.
#
# Run this by hand when you want installers to test. They attach to the run, so
# testing never spends a version number.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reads the commits since the last tag, works out the next version, and keeps
  # the release pull request in step with it. It does not publish; the publish
  # job below waits until both installers are built.
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # `node` reads and writes package.json, so the version the desk compares
      # itself against is the same one that gets tagged.
      # If this fails with "GitHub Actions is not permitted to create or approve
      # pull requests", the release branch will exist with no pull request
      # against it. Turn the setting back on for the go7studio organization, at
      # Settings, Actions, Workflow permissions. The repository page greys the
      # same control out and looks broken; the organization page is the one that
      # works. Leave the default token on read — the jobs here grant their own.
      - uses: googleapis/release-please-action@v5
        id: please
        with:
          skip-github-release: true

  # A version exists only after the release PR's package.json bump reaches main.
  # That keeps ordinary fixes/features from publishing anything.
  detect-release:
    # A manual run counts only from main: it may publish a version that has
    # no release yet (a cut whose installer job failed after a workflow-only
    # fix), never a branch's copy of that version.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cut: ${{ steps.detect.outputs.cut }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Cuts when the version itself changed and that version has no release.
      # See scripts/detect-release.mjs for why "package.json was touched" was
      # the wrong question, and what it cost.
      - name: Detect an unpublished version bump
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKHORSE_RELEASE_MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/detect-release.mjs

  installers:
    needs: [prepare, detect-release]
    if: ${{ always() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.detect-release.outputs.cut == 'true') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
            installer: "*Workhorse-Setup-*.exe"
          # Pinned, not latest: the macos-26 image that rolled on 2026-08-28
          # (runner image 20260828) breaks electron-builder's temporary
          # signing keychain at set-key-partition-list ("SecKeychainUnlock:
          # passphrase incorrect"). The 0.6.55 cut signed on the 20260728
          # image with the same electron-builder. Revisit when either moves.
          - os: macos-15
            script: package:mac
            # Both Apple silicon and Intel. The glob has to keep the arch
            # suffix in view or it collects one dmg and Intel Macs get nothing.
            installer: "*Workhorse-*-mac-*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # eval:validate resolves suite.baselineRef with
          # git merge-base --is-ancestor, which a depth-1 clone cannot answer.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Test
        timeout-minutes: 6
        run: npm test

      - name: Build installer
        shell: bash
        env:
          # Stamp every published installer as release. Signing/notarizing is
          # still macOS-only below. v0.6.9 (Mac) and v0.6.31 (Windows) shipped
          # {"channel":"development"} when this flag stayed 0, so the installed
          # desk opened the Dev profile with volatile credentials.
          WORKHORSE_RELEASE_BUILD: ${{ (github.event_name == 'workflow_dispatch' || needs.detect-release.outputs.cut == 'true') && '1' || '0' }}
          MAC_CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          MAC_CSC_NAME: ${{ runner.os == 'macOS' && secrets.MAC_CSC_NAME || '' }}
          MAC_APPLE_ID: ${{ runner.os == 'macOS' && secrets.MAC_APPLE_ID || '' }}
          MAC_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_APP_SPECIFIC_PASSWORD || '' }}
          MAC_APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.MAC_APPLE_TEAM_ID || '' }}
          # Authenticode, when a certificate exists. Until then the exe ships
          # unsigned and Windows says "unknown publisher" — and so does a
          # fork's, which is the whole problem: on Windows there is currently
          # nothing a user can check to tell our installer from a copy.
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        # The Windows leg never sees the certificate: these resolve to '' off
        # macOS, so signing material is only materialised on the job that
        # signs. A signing variable is then exported only when it has a value.
        # electron-builder treats CSC_LINK="" as a path, resolves it to the
        # checkout, and dies with "not a file" — which is what a missing secret
        # used to look like. Unset, it falls back to an ad-hoc signature for a
        # test build, and the release gate in after-pack says plainly what is
        # missing.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pairs="CSC_LINK:MAC_CSC_LINK CSC_KEY_PASSWORD:MAC_CSC_KEY_PASSWORD CSC_NAME:MAC_CSC_NAME
                   APPLE_ID:MAC_APPLE_ID APPLE_APP_SPECIFIC_PASSWORD:MAC_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID:MAC_APPLE_TEAM_ID"
          else
            pairs="CSC_LINK:WIN_CSC_LINK CSC_KEY_PASSWORD:WIN_CSC_KEY_PASSWORD"
          fi
          for pair in $pairs; do
            target="${pair%%:*}"
            source="${pair#*:}"
            if [ -n "${!source}" ]; then
              export "$target"="${!source}"
            fi
          done
          if [ "$RUNNER_OS" = "Windows" ] && [ -z "$CSC_LINK" ]; then
            echo "::warning::Windows installer is unsigned — no WIN_CSC_LINK. Users will see an unknown-publisher prompt, and a fork's installer looks identical to this one."
          fi
          npm run ${{ matrix.script }}

      - name: Packaged learning smoke
        run: node scripts/learning-packaged-smoke.mjs

      # A build stamped "development" opens on the Dev user-data directory with
      # volatile credentials. Installed over production that looks exactly like
      # total data loss. v0.6.9 shipped that way, so the artifact is checked
      # here rather than trusting the flag that produced it.
      - name: Refuse a development-stamped release
        env:
          WORKHORSE_RELEASE_BUILD: ${{ (github.event_name == 'workflow_dispatch' || needs.detect-release.outputs.cut == 'true') && '1' || '0' }}
        run: node scripts/assert-release-channel.mjs

      # Held here rather than sent straight to the release, so a machine that
      # fails cannot leave half a release behind.
      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: release/${{ matrix.installer }}
          if-no-files-found: error

  # Both installers or neither. 0.1.6 published a dmg with no exe and 0.1.8 an
  # exe with no dmg. Each was marked latest, and each was broken for half the
  # people who downloaded it.
  publish:
    needs: [detect-release, installers]
    # Both installers or neither — but nothing else gets a veto. `prepare` only
    # keeps the next release pull request up to date; when a GitHub incident
    # made it fail, 0.1.9 built and signed both installers and then published
    # nothing, because a failed ancestor skips a job that does not say
    # otherwise. Ask for what actually matters instead.
    if: ${{ !cancelled() && needs.detect-release.outputs.cut == 'true' && needs.installers.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Moving the release pull request's label is a pull-request write, and
      # labels themselves live on the issues API. Without both, publishing
      # succeeds and then dies on the label, which is how 0.2.0 shipped under a
      # red job.
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Extract release notes
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = new RegExp(`^## \\[?${version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\]?.*$`, 'm');
          const match = heading.exec(changelog);

          if (!match) {
            fs.writeFileSync('release-notes.md', `See CHANGELOG.md for ${version}.\n`);
            process.exit(0);
          }

          const start = match.index + match[0].length;
          const rest = changelog.slice(start);
          const next = rest.search(/^## /m);
          const body = (next === -1 ? rest : rest.slice(0, next)).trim();
          fs.writeFileSync('release-notes.md', `${body || `See CHANGELOG.md for ${version}.`}\n`);
          NODE

      - name: Publish the whole release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.detect-release.outputs.tag }}" installers/* \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "Go7 Workhorse ${{ needs.detect-release.outputs.version }}" \
            --notes-file release-notes.md

      # release-please refuses to open the next release pull request while a
      # merged one still looks untagged — "There are untagged, merged release
      # PRs outstanding - aborting". It normally moves this label itself when it
      # creates the GitHub release, but this workflow passes
      # skip-github-release and creates the release above, so the label has to
      # be moved here. Without it, one release is the last release anyone can
      # cut, and nothing says why.
      - name: Mark the release pull request tagged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "autorelease: tagged" --repo "$GITHUB_REPOSITORY" \
            --color ededed --description "Release pull request whose tag exists" 2>/dev/null || true
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
                        --label "autorelease: pending" --json number --jq '.[].number'); do
            echo "marking #${pr} tagged"
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" \
              --add-label "autorelease: tagged" --remove-label "autorelease: pending"
          done
